name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Evita la llamada de red de telemetría de Next.js durante `pnpm build`.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck + lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  db:
    name: DB
    runs-on: ubuntu-latest
    # PostgreSQL 16: la misma versión contra la que se validó el esquema
    # (packages/db/README.md "Verificación", ADR-018).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: joda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # ?schema=app fija qué schema califica sin prefijo cuando Postgres
      # reconstruye el SQL de una vista (pg_get_viewdef) — sin esto, `pnpm
      # db:pull` genera un `prisma/views/**/*.sql` con nombres de tabla
      # calificados distinto (`app.inventory_lots` en vez de
      # `inventory_lots`) y el chequeo de drift de más abajo se rompe todo
      # el tiempo por una diferencia cosmética. Ver packages/db/README.md.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/joda?schema=app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm db:reset
      - run: pnpm db:test
      # WP-B04: el cliente tipado (packages/db/prisma/schema.prisma) se
      # regenera por introspección y se commitea — nada lo obliga a estar al
      # día salvo esto. `db:pull` ya falla si el cliente generado no expone
      # los mismos modelos/vistas que schema.prisma (scripts/verify-prisma-
      # client.mjs); el diff de acá atrapa el otro caso, que alguien haya
      # cambiado una migración sin correr `pnpm db:pull` y commitear el
      # resultado.
      - run: pnpm db:pull
      - run: |
          git diff --exit-code -- packages/db/prisma/schema.prisma packages/db/prisma/views || {
            echo "::error::schema.prisma (o prisma/views) está desactualizado. Corré 'pnpm db:pull' y commiteá el resultado.";
            exit 1;
          }

  # WP-M18 — humo del entorno local de punta a punta (docs/runbooks/entorno-local.md):
  # `pnpm dev:setup` levanta Postgres, Redis y el Auth local (GoTrue + proxy) con
  # docker compose, reinicia la base, da de alta un usuario por rol y siembra los
  # datos de muestra POR LA API; después corre el contrato de StaffAuthProvider contra
  # ese GoTrue y el humo de Playwright (login con segundo factor por rol, catálogo,
  # alta de un producto, el vendedor sin costos). Versiones fijas: GoTrue, Postgres,
  # Redis y nginx en docker-compose.yml; Playwright en e2e/package.json.
  e2e:
    name: E2E smoke (entorno local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Caché de navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1
      - run: pnpm --filter @joda/e2e exec playwright install --with-deps chromium
      - run: pnpm dev:setup
      - run: pnpm test:auth-local
      - run: pnpm e2e:smoke
      - name: Registros de docker compose
        if: failure()
        run: docker compose -p joda --env-file .env.local -f infra/docker/docker-compose.yml --profile auth logs --tail=200
      - name: Informe y trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
